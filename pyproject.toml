[project]
name = "aimpoint-harness"
version = "0.1.0"
description = "Self-hosted harness: per-profile soul, skills and MCPs behind an OpenAI-compatible API over your LLM subscription"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Ryan", email = "845245+rm2kdev@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=1.12,<2",
    "pyyaml>=6.0.3",
    "starlette>=1.10.0",
    "uvicorn[standard]>=0.54.0",
]

[project.urls]
Homepage = "https://github.com/rm2kdev/aimpoint-harness"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[project.scripts]
aimpoint = "aimpoint_harness.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
